id = "odiumuniverse.diff-viewer"
name = "Diff Viewer"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "Session diff sidebar: changed files with red/green hunks, click a file to jump, drag to send lines into the agent prompt."

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "toggle"
title = "Diff viewer: toggle session diff sidebar"
contexts = ["pane"]
command = ["./target/release/diff-viewer", "toggle"]

# Full-height diff sidebar. Opened programmatically by the `toggle` action via
# `herdr plugin pane open --entrypoint viewer --placement split`, which spawns
# this command non-interactively. The tab id comes from herdr's HERDR_TAB_ID
# env (set for plugin panes); repo + agent pane arrive via --env (see main).
[[panes]]
id = "viewer"
title = "session diff"
placement = "split"
command = ["./target/release/diff-viewer", "viewer"]
