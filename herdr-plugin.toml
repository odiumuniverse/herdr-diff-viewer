id = "odiumuniverse.diff-viewer"
name = "Diff Viewer"
version = "0.5.1"
min_herdr_version = "0.9.0"
platforms = ["macos", "linux"]
description = "✨ Beautiful & ⚡ BLAZINGLY FAST git diff sidebar: changed files with red/green hunks, click a file to jump, drag to send lines into the agent prompt. 🦀"

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "toggle"
title = "Diff viewer: toggle git diff sidebar"
contexts = ["pane"]
command = ["./target/release/diff-viewer", "toggle"]

[[panes]]
id = "viewer"
title = "git diff"
placement = "split"
command = ["./target/release/diff-viewer", "viewer"]
